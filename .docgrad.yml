# .docgrad.yml — docgrad configuration (version-controlled, shared by the team)
# This repo is a Claude Code skill:
#   entry = SKILL.md (the only file auto-loaded when the skill triggers; README.md is the
#           human-facing GitHub landing page, not loaded into agent context, so it is not
#           listed as an entry_file — listing it would inflate the fixed cost by 1,807 tokens)
#   index = README.md (the human navigation entry point, the starting point for linkage reachability)
docs_dirs: [docs/, reference/]
entry_files: [SKILL.md]
index_file: README.md
src_dirs: [scripts/]
scenarios: [scripts/links.mjs, scripts/lib.mjs]
exclude: []
freshness:
  convention: heading-line
  field: "Last updated:"
targets:
  completeness: 4
  correctness: 4
  freshness: 4
  linkage: 4
  consistency: 4
  economy: 4
correctness_sample: 8
scenario: "add a new scoring dimension to docgrad"
language: en
